name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: album_bot
          POSTGRES_USER: album_bot
          POSTGRES_PASSWORD: album_bot_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U album_bot -d album_bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://album_bot:album_bot_password@localhost:5433/album_bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply DB schema and seed
        run: |
          psql $DATABASE_URL -f db/01-schema.sql
          psql $DATABASE_URL -f db/02-seed-album-data.sql
          psql $DATABASE_URL -f db/03-trade-offers.sql

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
