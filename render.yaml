services:
  - type: web
    name: album-bot
    runtime: node
    buildCommand: npm install && npm run db:migrate && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: album-bot-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PORT
        value: 10000

databases:
  - name: album-bot-db
    databaseName: album_bot
    user: album_bot
    plan: free
